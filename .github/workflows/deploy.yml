name: 🚀 Deploy to Server

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.0

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            BRANCH="${{ github.ref_name }}"

            echo "🌿 Branch: $BRANCH"

            if [ "$BRANCH" = "main" ]; then
              PORT=9030
              ENV=production
            elif [ "$BRANCH" = "staging" ]; then
              PORT=9025
              ENV=staging
            else
              echo "❌ Unsupported branch: $BRANCH"
              exit 1
            fi

            echo "🌍 ENV: $ENV"
            echo "🔌 PORT: $PORT"

            PROJECT_DIR="/www/wwwroot/JHS-Associates-Website"

            # Clone if not exists
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📥 Cloning repository..."
              git clone https://github.com/jhsassociatesllp/JHS-Associates-Website.git $PROJECT_DIR
            fi

            cd $PROJECT_DIR

            echo "📦 Pulling latest code..."
            git fetch --all
            git reset --hard origin/$BRANCH

            echo "🛑 Stopping old containers..."
            docker compose down --volumes --remove-orphans || true

            echo "🧹 Removing old project containers..."
            docker ps -a --filter "name=jhs_" -q | xargs -r docker rm -f

            echo "🧹 Removing dangling images..."
            docker image prune -af || true

            echo "🚀 Rebuilding ALL services without cache..."
            FRONTEND_PORT=$PORT docker compose build --no-cache

            echo "🚀 Starting fresh containers..."
            FRONTEND_PORT=$PORT docker compose up -d --force-recreate

            echo "📋 Active containers:"
            docker ps

            echo "✅ Deployment completed successfully"