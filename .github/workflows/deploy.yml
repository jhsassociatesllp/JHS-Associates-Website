name: 🚀 Deploy to Server

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}

          script: |

            set -e

            BRANCH="${{ github.ref_name }}"

            echo "🌿 Branch: $BRANCH"

            # ==========================================
            # ENVIRONMENT CONFIG
            # ==========================================

            if [ "$BRANCH" = "main" ]; then
              FRONTEND_PORT=9030
              BACKEND_PORT=9035
              ADMIN_PORT=9040
              ENV=production

            elif [ "$BRANCH" = "staging" ]; then
              FRONTEND_PORT=9025
              BACKEND_PORT=9030
              ADMIN_PORT=9035
              ENV=staging

            else
              echo "❌ Unsupported branch: $BRANCH"
              exit 1
            fi

            echo "🌍 Environment: $ENV"
            echo "🌐 Frontend Port: $FRONTEND_PORT"
            echo "⚙️ Backend Port: $BACKEND_PORT"
            echo "🛠️ Admin Port: $ADMIN_PORT"

            PROJECT_DIR="/www/wwwroot/JHS-Associates-Website"

            # ==========================================
            # CLONE REPO IF NOT EXISTS
            # ==========================================

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📥 Cloning repository..."

              git clone https://github.com/jhsassociatesllp/JHS-Associates-Website.git $PROJECT_DIR
            fi

            cd $PROJECT_DIR

            # ==========================================
            # PULL LATEST CODE
            # ==========================================

            echo "📦 Pulling latest code..."

            git fetch --all
            git reset --hard origin/$BRANCH

            # ==========================================
            # CREATE MEDIA DIRECTORY
            # ==========================================

            mkdir -p media

            # ==========================================
            # STOP OLD CONTAINERS
            # ==========================================

            echo "🛑 Restarting containers..."

            export FRONTEND_PORT=$FRONTEND_PORT
            export BACKEND_PORT=$BACKEND_PORT
            export ADMIN_PORT=$ADMIN_PORT

            # API URL
            export VITE_API_BASE_URL="http://${{ secrets.SERVER_HOST }}:$BACKEND_PORT/api"
            # export VITE_API_BASE_URL="/api"

            # Backend ENV
            export MONGODB_URL="${{ secrets.MONGODB_URL }}"
            export DATABASE_NAME="${{ secrets.DATABASE_NAME }}"

            docker compose down --remove-orphans
            docker compose up -d --build

            # ==========================================
            # SHOW RUNNING CONTAINERS
            # ==========================================

            echo "📋 Running Containers"

            docker ps

            echo "✅ Deployment Completed Successfully"