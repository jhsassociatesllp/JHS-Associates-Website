name: 🚀 Deploy to Server

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}

          script: |

            set -e

            BRANCH="${{ github.ref_name }}"

            echo "🌿 Branch: $BRANCH"

            # ==========================================
            # ENVIRONMENT CONFIG
            # ==========================================
            # Each branch gets its own project directory, uploads directory,
            # host ports, and database so main and staging can run side by
            # side on the same server without colliding.

            if [ "$BRANCH" = "main" ]; then
              PROJECT_DIR="/www/wwwroot/JHS-Associates-Website-main"
              UPLOADS_DIR="/www/wwwroot/jhs-website-content-main/uploads"
              GATEWAY_PORT=9015
              ADMIN_PORT=9020
              MONGODB_URL="${{ secrets.MONGODB_URL_MAIN }}"
              DATABASE_NAME="${{ secrets.DATABASE_NAME_MAIN }}"
              COMPOSE_PROJECT_NAME="jhs-main"
              ENV=production

            elif [ "$BRANCH" = "staging" ]; then
              PROJECT_DIR="/www/wwwroot/JHS-Associates-Website"
              UPLOADS_DIR="/www/wwwroot/jhs-website-content/uploads"
              GATEWAY_PORT=9025
              ADMIN_PORT=9030
              MONGODB_URL="${{ secrets.MONGODB_URL }}"
              DATABASE_NAME="${{ secrets.DATABASE_NAME }}"
              COMPOSE_PROJECT_NAME="jhs-staging"
              ENV=staging

            else
              echo "❌ Unsupported branch: $BRANCH"
              exit 1
            fi

            echo "🌍 Environment: $ENV"
            echo "📁 Project Dir: $PROJECT_DIR"
            echo "🖼️ Uploads Dir: $UPLOADS_DIR"
            echo "🌐 Gateway Port: $GATEWAY_PORT"
            echo "🛠️ Admin Port: $ADMIN_PORT"

            # ==========================================
            # CLONE REPO IF NOT EXISTS
            # ==========================================

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📥 Cloning repository..."

              git clone https://github.com/jhsassociatesllp/JHS-Associates-Website.git $PROJECT_DIR
            fi

            cd $PROJECT_DIR

            # ==========================================
            # PULL LATEST CODE
            # ==========================================

            echo "📦 Pulling latest code..."

            git fetch --all
            git reset --hard origin/$BRANCH

            # ==========================================
            # CREATE MEDIA / UPLOADS DIRECTORIES
            # ==========================================

            mkdir -p media
            mkdir -p "$UPLOADS_DIR/images"

            # ==========================================
            # STOP OLD CONTAINERS
            # ==========================================

            echo "🛑 Restarting containers..."

            export UPLOADS_DIR=$UPLOADS_DIR
            export GATEWAY_PORT=$GATEWAY_PORT
            export ADMIN_PORT=$ADMIN_PORT
            export COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME

            # API URL — relative, resolved by each stack's own gateway/nginx
            export VITE_API_BASE_URL="/api"

            # Backend ENV
            export MONGODB_URL=$MONGODB_URL
            export DATABASE_NAME=$DATABASE_NAME

            docker compose -p $COMPOSE_PROJECT_NAME down --remove-orphans
            docker compose -p $COMPOSE_PROJECT_NAME up -d --build

            # ==========================================
            # SHOW RUNNING CONTAINERS
            # ==========================================

            echo "📋 Running Containers"

            docker ps

            echo "✅ Deployment Completed Successfully"