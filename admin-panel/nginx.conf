# ── Rate limits (edge). Counted per visitor address; nginx answers 429 before the request reaches the API. ──
# login: 10 a minute (a few more allowed in a burst); downloads: 6 a minute; everything else under /api/: 600 a minute.
limit_req_zone $binary_remote_addr zone=jhs_admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=jhs_admin_export:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=jhs_admin_api:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=jhs_admin_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;

    server_name localhost;

    # Count the real visitor, not the proxies in front of us (Docker network, aaPanel on the same server, Cloudflare).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Enforced Content-Security-Policy. This panel keeps the admin login token in the browser, so scripts may only
    # come from this site (no inline or third-party scripts) - that is what stops a stored-XSS from stealing it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (PDFs + images for white papers, articles, etc.)
    client_max_body_size 50m;

    # Sign-in: the strictest limit (the API also locks an account after 5 wrong passwords).
    location ~ ^/api/admin/login(-form)?$ {
        limit_req zone=jhs_admin_login burst=5 nodelay;
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Allow large request bodies through the proxy
        client_max_body_size 50m;
    }

    # Excel / ZIP downloads: heavy and full of client data.
    location ~ ^/api/(export/|proposal/export|careers/admin/applications/export) {
        limit_req zone=jhs_admin_export burst=3 nodelay;
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Allow large request bodies through the proxy
        client_max_body_size 50m;
    }

    # Proxy API requests to the backend service
    location /api/ {
        limit_req zone=jhs_admin_api burst=100 nodelay;
        limit_conn jhs_admin_conn 40;

        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Allow large request bodies through the proxy
        client_max_body_size 50m;
    }

    location / {
        try_files $uri /index.html;
    }
}