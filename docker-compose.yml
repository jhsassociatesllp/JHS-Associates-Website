services:
  backend:
    build: ./backend
    container_name: jhs_backend

  frontend:
    build: ./frontend
    container_name: jhs_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      # Mount the external uploads directory into nginx so images are served
      # directly without being bundled into the Docker image.
      # Host path   : /www/wwwroot/JHS Website/Uploads/images
      # Inside nginx: /usr/share/nginx/uploads  (aliased → /Uploads/images/)
      - "/www/wwwroot/jhs-website-content/uploads/images:/usr/share/nginx/uploads:ro"
    depends_on:
      - backend