services:

  backend:
    build: ./backend
    container_name: jhs_backend

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - "/www/wwwroot/jhs-website-content/uploads:/app/uploads"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: jhs_frontend

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      - backend

    volumes:
      - "/www/wwwroot/jhs-website-content/uploads/images:/usr/share/nginx/uploads:ro"

  admin:
    build:
      context: ./admin-panel
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: jhs_admin

    ports:
      - "${ADMIN_PORT}:80"

    depends_on:
      - backend