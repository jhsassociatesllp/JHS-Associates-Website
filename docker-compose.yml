services:

  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    build: ./backend

    container_name: jhs_backend

    environment:
      MONGODB_URL: ${MONGODB_URL}
      DATABASE_NAME: ${DATABASE_NAME}

    expose:
      - "8000"

    volumes:
      - "/www/wwwroot/jhs-website-content/uploads:/app/uploads"

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: jhs_frontend

    expose:
      - "80"

    depends_on:
      - backend

    volumes:
      - "/www/wwwroot/jhs-website-content/uploads/images:/usr/share/nginx/uploads:ro"

  # ==========================================
  # ADMIN PANEL
  # ==========================================
  admin:
    build:
      context: ./admin-panel
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: jhs_admin

    ports:
      - "9030:80"

    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: jhs_gateway

    ports:
      - "9025:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend
      - admin
      