server {
    listen 80;

    client_max_body_size 25m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Report-Only first: open the browser console, check nothing legitimate is listed as blocked,
    # then rename this header to Content-Security-Policy to enforce it.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://translate.googleapis.com https://translate.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://accounts.google.com https://translate.googleapis.com; frame-src https://accounts.google.com https://www.google.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
    }

    location /Uploads/images/ {
        alias /usr/share/nginx/uploads/;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # Website content chatbot — a separate Node.js service (see
    # chatbot-backend/ at the repo root), not the main FastAPI backend above.
    # "chatbot-backend" here is the Docker Compose service name (built from ./chatbot-backend,
    # listening on 3001).
    # The re-index endpoint is for administrators only; it is never reachable from the internet.
    location = /chatbot-api/reindex { return 404; }

    location /chatbot-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $chatbot_upstream "chatbot-backend:3001";
        rewrite ^/chatbot-api/(.*) /api/$1 break;
        proxy_pass http://$chatbot_upstream;
        proxy_buffering off; # needed for the streamed (SSE) chat answers
    }

}