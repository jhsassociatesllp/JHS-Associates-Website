# Page URLs the app really has (generated at build time, see scripts/gen-known-routes.mjs).
include /etc/nginx/conf.d/known-routes.inc;

server {
    listen 80;

    client_max_body_size 64k;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (including the enforced CSP) live in one file so every location can include them.
    include /etc/nginx/security-headers.conf;

    # Unknown URLs get a real HTTP 404, still showing the app's "page not found" screen.
    error_page 404 /index.html;

    # The page itself is never cached for long, so a new release is picked up straight away.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The home page is the same file as /index.html, so it gets the same short-cache rule.
    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        try_files $uri =404;
    }

    # No dot-files (.env, .git ...) and no backup / source-map / script files, ever.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(map|bak|old|orig|sql|zip|tar|gz|7z|rar|php|asp|aspx|jsp|cgi|ini|log)$ { return 404; }

    location / {
        try_files $uri $uri/index.html @spa;
    }

    location @spa {
        if ($jhs_known_route = 0) { return 404; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    location /uploads/ {
        include /etc/nginx/security-headers.conf;
        alias /usr/share/nginx/uploads/;
    }

    location /Uploads/images/ {
        include /etc/nginx/security-headers.conf;
        alias /usr/share/nginx/uploads/;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # Website content chatbot - a separate Node.js service (see chatbot-backend/ at the repo root),
    # not the main FastAPI backend above. "chatbot-backend" is the Docker Compose service name.
    # The re-index endpoint is for administrators only; it is never reachable from the internet.
    location = /chatbot-api/reindex { return 404; }

    location /chatbot-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $chatbot_upstream "chatbot-backend:3001";
        rewrite ^/chatbot-api/(.*) /api/$1 break;
        proxy_pass http://$chatbot_upstream;
        proxy_buffering off; # needed for the streamed (SSE) chat answers
    }

}
