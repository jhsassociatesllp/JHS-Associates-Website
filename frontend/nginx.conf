server {
    listen 80;

    client_max_body_size 25m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
    }

    location /Uploads/images/ {
        alias /usr/share/nginx/uploads/;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # Website content chatbot — a separate Node.js service (see
    # chatbot-backend/ at the repo root), not the main FastAPI backend above.
    # "chatbot-backend" here is the Docker Compose service name — add it as
    # its own service in docker-compose.yml (built from ./chatbot-backend,
    # listening on 3001) the same way "backend" already is. If it's run as a
    # plain background process on the host instead of containerized, point
    # this at that host/port instead (e.g. http://127.0.0.1:3001/).
    location /chatbot-api/ {
        proxy_pass http://chatbot-backend:3001/api/;
        proxy_buffering off; # needed for the streamed (SSE) chat answers
    }
}