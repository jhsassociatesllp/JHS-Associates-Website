server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Serve externally-managed images from the mounted uploads volume.
    # Production host path : /www/wwwroot/JHS Website/Uploads/images
    # Mounted inside container at : /usr/share/nginx/uploads
    # Accessible to the browser as : /Uploads/images/<filename>
    location /Uploads/images/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }
}
