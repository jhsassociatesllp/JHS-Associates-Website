# Included in every place that sets its own add_header (nginx drops inherited headers otherwise).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# Enforced Content-Security-Policy (audit SEC-02). No 'unsafe-inline' for scripts: the build has no inline scripts.
# 'unsafe-inline' stays for styles only because React sets inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://translate.googleapis.com https://translate.google.com https://www.gstatic.com https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://www.gstatic.com https://translate.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://accounts.google.com https://translate.googleapis.com https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src https://accounts.google.com https://www.google.com https://www.youtube.com https://www.youtube-nocookie.com https://*.hostingersite.com https://challenges.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
